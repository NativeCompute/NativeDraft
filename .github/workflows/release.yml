name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          pack() {
            local name="$1-${RELEASE_TAG}-linux-x86_64"
            mkdir -p "$name/packaging"
            cp target/release/nativedraft "$name/$1"
            cp install.sh README.md LICENSE "$name/"
            cp packaging/nativedraft.desktop packaging/nativedraft.svg "$name/packaging/"
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          }
          pack nativedraft
          pack blackline
          cp "nativedraft-${RELEASE_TAG}-linux-x86_64.tar.gz" nativedraft-linux-x86_64.tar.gz
          sha256sum nativedraft-linux-x86_64.tar.gz > nativedraft-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            nativedraft-*.tar.gz*
            blackline-*.tar.gz*

  linux-packages:
    name: Linux packages (deb, rpm, AppImage, AUR)
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build the packages
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0
          tarball="dist/nativedraft-${RELEASE_TAG}-linux-x86_64.tar.gz"
          tar -xzf "$tarball" -C dist
          bash packaging/linux/package.sh "${RELEASE_TAG}" "dist/nativedraft-${RELEASE_TAG}-linux-x86_64/nativedraft" out "$tarball"
          cp "$tarball" out/
          cp "out/nativedraft-${RELEASE_TAG}-linux-x86_64.AppImage" out/nativedraft-linux-x86_64.AppImage
          (cd out && sha256sum nativedraft-linux-x86_64.AppImage > nativedraft-linux-x86_64.AppImage.sha256)
          cp out/nativedraft_*_amd64.deb out/nativedraft-linux-amd64.deb
          cp out/nativedraft-*-1.x86_64.rpm out/nativedraft-linux-x86_64.rpm
          (cd out && sha256sum nativedraft-linux-amd64.deb > nativedraft-linux-amd64.deb.sha256 && sha256sum nativedraft-linux-x86_64.rpm > nativedraft-linux-x86_64.rpm.sha256)
          cp out/aur/nativedraft-bin/PKGBUILD out/nativedraft-bin.PKGBUILD
          cp out/aur/nativedraft/PKGBUILD out/nativedraft.PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/

  linux-verify:
    name: Install on ${{ matrix.name }}
    needs: linux-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Arch Linux (AUR), image: "archlinux:latest", kind: arch }
          - { name: Fedora (rpm), image: "fedora:41", kind: rpm }
          - { name: Debian 12 (deb), image: "debian:12", kind: deb }
          - { name: Ubuntu 22.04 (deb), image: "ubuntu:22.04", kind: deb }
          - { name: Ubuntu 24.04 (AppImage), image: "ubuntu:24.04", kind: appimage }
          - { name: Fedora (AppImage), image: "fedora:41", kind: appimage }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Install, open and smoke-test
        timeout-minutes: 20
        run: bash packaging/linux/verify-package.sh ${{ matrix.kind }} out

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build .#nativedraft --print-build-logs
      - name: Open and smoke-test
        timeout-minutes: 15
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1600x1000x24" ./result/bin/nativedraft --smoke "$RUNNER_TEMP/smoke" || true
          cat "$RUNNER_TEMP/smoke/report.txt"
          grep -q '^PASS' "$RUNNER_TEMP/smoke/report.txt"

  aur:
    name: Publish to the AUR
    needs: [publish, linux-packages]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Publish nativedraft-bin and nativedraft
        if: env.AUR_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
          for pkg in nativedraft-bin nativedraft; do
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "aur-${pkg}"
            cp "out/aur/${pkg}/PKGBUILD" "aur-${pkg}/PKGBUILD"
            docker run --rm -v "$PWD/aur-${pkg}:/pkg" -w /pkg archlinux:latest bash -c "useradd -m b && chown -R b /pkg && su b -c 'makepkg --printsrcinfo' > /pkg/.SRCINFO"
            sudo chown -R "$USER" "aur-${pkg}"
            cd "aur-${pkg}"
            git -c user.name="NativeCompute" -c user.email="hello@nativecompute.net" add PKGBUILD .SRCINFO
            git -c user.name="NativeCompute" -c user.email="hello@nativecompute.net" commit -m "${RELEASE_TAG}" || true
            git push origin HEAD:master
            cd ..
          done
      - name: No AUR key yet
        if: env.AUR_SSH_KEY == ''
        run: echo "Add an AUR_SSH_KEY secret to publish nativedraft-bin and nativedraft to the AUR automatically. The PKGBUILDs are attached to the release."

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          function Pack($slug) {
            $name = "$slug-$env:RELEASE_TAG-windows-x86_64"
            New-Item -ItemType Directory -Path $name | Out-Null
            Copy-Item target/release/nativedraft.exe -Destination "$name/$slug.exe"
            Copy-Item README.md, LICENSE -Destination $name
            Compress-Archive -Path $name -DestinationPath "$name.zip"
            $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
            "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          }
          Pack nativedraft
          Pack blackline
          Copy-Item "nativedraft-$env:RELEASE_TAG-windows-x86_64.zip" -Destination nativedraft-windows-x86_64.zip
          $hash = (Get-FileHash -Algorithm SHA256 nativedraft-windows-x86_64.zip).Hash.ToLower()
          "$hash  nativedraft-windows-x86_64.zip" | Out-File -Encoding ascii -NoNewline nativedraft-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            nativedraft-*.zip*
            blackline-*.zip*

  macos:
    name: macOS build (universal)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build, sign and zip NativeDraft.app
        run: packaging/macos/bundle.sh --out dist
      - name: Package
        run: |
          cd dist
          name="nativedraft-${RELEASE_TAG}-macos-universal.zip"
          cp nativedraft-macos.zip "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cp nativedraft-macos.zip blackline-macos.zip
          shasum -a 256 blackline-macos.zip > blackline-macos.zip.sha256
          cp ../install-macos.sh .
          shasum -a 256 -c nativedraft-macos.zip.sha256
          shasum -a 256 -c blackline-macos.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/nativedraft-*.zip
            dist/nativedraft-*.zip.sha256
            dist/blackline-macos.zip
            dist/blackline-macos.zip.sha256
            dist/install-macos.sh

  macos-intel:
    name: macOS tests on Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release

  macos-verify:
    name: macOS ${{ matrix.os }} — install the release on a fresh Mac
    needs: macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - name: Install, open, update and uninstall
        timeout-minutes: 15
        run: /bin/bash packaging/macos/verify-install.sh dist

  publish:
    name: GitHub Release
    needs: [linux, linux-packages, linux-verify, nix, windows, macos, macos-intel, macos-verify]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            nativedraft-*.tar.gz
            nativedraft-*.zip
            nativedraft-*.zip.sha256
            nativedraft-*.tar.gz.sha256
            blackline-*.tar.gz
            blackline-*.zip
            blackline-*.zip.sha256
            blackline-*.tar.gz.sha256
            nativedraft*.deb
            nativedraft*.deb.sha256
            nativedraft*.rpm
            nativedraft*.rpm.sha256
            nativedraft*.AppImage
            nativedraft*.AppImage.sha256
            nativedraft-bin.PKGBUILD
            nativedraft.PKGBUILD
            install-macos.sh
          generate_release_notes: true
